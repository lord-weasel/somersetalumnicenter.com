<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Independent Website Notice</title>
<link rel="icon" href="assets/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html { min-height: 100%; }

  :root {
    --purple: #541565;
    --gold: #DDB92A;
    --light: #F7F1F9;
  }

  body {
    min-height: 100vh;
    background-color: var(--purple);
    background-image:
      radial-gradient(ellipse at 20% 50%, rgba(221,185,42,0.08) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 20%, rgba(255,255,255,0.04) 0%, transparent 50%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Lato', sans-serif;
    color: var(--light);
    padding: 2rem;
  }

  .card {
    text-align: center;
    max-width: 620px;
    animation: fadeUp 0.9s ease both;
  }

  .icon {
    width: 64px;
    height: 64px;
    margin: 0 auto 2rem;
    opacity: 0.9;
    animation: fadeUp 0.9s 0.1s ease both;
  }

  .divider {
    width: 48px;
    height: 3px;
    background: var(--gold);
    margin: 1.5rem auto;
    border-radius: 2px;
    animation: fadeUp 0.9s 0.2s ease both;
  }

  h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(1.8rem, 5vw, 2.7rem);
    font-weight: 700;
    letter-spacing: 0.01em;
    color: #fff;
    animation: fadeUp 0.9s 0.15s ease both;
  }

  .org {
    font-size: 0.78rem;
    font-weight: 400;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 0.5rem;
    animation: fadeUp 0.9s 0.05s ease both;
  }

  p {
    font-size: 1rem;
    font-weight: 300;
    line-height: 1.75;
    color: rgba(249,245,255,0.78);
    animation: fadeUp 0.9s 0.3s ease both;
  }

  .confirm-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 240px;
    margin-top: 2rem;
    padding: 0.85rem 1.4rem;
    border: 1.5px solid var(--gold);
    border-radius: 999px;
    background: var(--gold);
    color: #fff;
    font-family: 'Lato', sans-serif;
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    text-decoration: none;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.2s, background 0.2s;
    animation: fadeUp 0.9s 0.4s ease both;
  }

  .confirm-btn:hover { transform: translateY(-1px); }

  .confirm-btn[aria-disabled="true"] {
    opacity: 0.48;
    cursor: not-allowed;
    pointer-events: none;
    background: transparent;
    color: var(--gold);
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>
<main class="card">
  <p class="org">Independent Website Notice</p>

  <svg class="icon" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <circle cx="32" cy="32" r="30" stroke="#DDB92A" stroke-width="2" stroke-dasharray="6 4" opacity="0.5"/>
    <path d="M32 17v18" stroke="#DDB92A" stroke-width="3" stroke-linecap="round"/>
    <circle cx="32" cy="43" r="2.5" fill="#DDB92A"/>
  </svg>

  <h1>Please Read Before Continuing</h1>
  <div class="divider"></div>
  <p>
    This website is independently maintained and is not affiliated with, endorsed by,
    or officially connected to the Somerset Alumni Center.
  </p>
  <a class="confirm-btn" id="confirmButton" href="home.html" aria-disabled="true" tabindex="-1">I understand</a>
</main>

<script>
  const confirmButton = document.getElementById('confirmButton');
  let canContinue = false;

  confirmButton.addEventListener('click', event => {
    if (!canContinue) event.preventDefault();
  });

  setTimeout(() => {
    canContinue = true;
    confirmButton.textContent = 'I Understand';
    confirmButton.setAttribute('aria-disabled', 'false');
    confirmButton.removeAttribute('tabindex');
  }, 5000);
</script>
</body>
</html>
