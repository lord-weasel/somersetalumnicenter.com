<!DOCTYPE html>
<html lang="en" class="notice-html">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Independent Website Notice</title>
<link rel="icon" href="assets/favicon.ico" sizes="any">
<link rel="apple-touch-icon" sizes="760x760" href="assets/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#541565">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Alumni Center">
<link rel="stylesheet" href="assets/styles.css?v=20260813-92">
</head>
<body class="notice-page">
<main class="card">
  <p class="org">Independent Website Notice</p>

  <svg class="icon" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <circle cx="32" cy="32" r="30" stroke="#DDB92A" stroke-width="2" stroke-dasharray="6 4" opacity="0.5"/>
    <path d="M32 17v18" stroke="#DDB92A" stroke-width="3" stroke-linecap="round"/>
    <circle cx="32" cy="43" r="2.5" fill="#DDB92A"/>
  </svg>

  <h1>Please Read Before Continuing</h1>
  <div class="divider"></div>
  <p>
    This website is independently maintained and is not affiliated with, endorsed by,
    or officially connected to the Somerset Alumni Center or Somerset Independent Schools.
  </p>
  <a class="confirm-btn" id="confirmButton" href="home.html" aria-disabled="true" tabindex="-1">I understand</a>
</main>

<script>
  const confirmButton = document.getElementById('confirmButton');
  let canContinue = false;

  confirmButton.addEventListener('click', event => {
    if (!canContinue) event.preventDefault();
  });

  setTimeout(() => {
    canContinue = true;
    confirmButton.textContent = 'I Understand';
    confirmButton.setAttribute('aria-disabled', 'false');
    confirmButton.removeAttribute('tabindex');
  }, 5000);
</script>
</body>
</html>
