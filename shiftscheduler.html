<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Somerset Alumni Center — Shift Scheduler</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap');

  :root {
    --purple:       #5E1771;
    --purple-deep:  #42104F;
    --purple-light: #7B3A8C;
    --purple-pale:  #F7F1F9;
    --purple-muted: #E7D7EC;
    --gold:         #DDB92A;
    --gold-dark:    #8A6A00;
    --gold-pale:    #FFF8D9;
    --white:        #ffffff;
    --bg:           #FBF8FC;
    --surface:      #ffffff;
    --text:         #221428;
    --text-muted:   #6F5D76;
    --border:       #DED1E5;
    --shift-am:     #5E1771;
    --shift-pm:     #DDB92A;
    --shift-sat:    #7B3A8C;
    --danger:       #B42318;
    --danger-pale:  #FFF1F0;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--white);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ── HEADER ── */
  header {
    background: linear-gradient(90deg, var(--purple) 0%, var(--purple-deep) 100%);
    color: var(--white);
    padding: 0 20px;
    display: flex;
    align-items: stretch;
    gap: 0;
    flex-shrink: 0;
    border-bottom: 3px solid var(--gold);
    min-height: 54px;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 20px 10px 0;
    border-right: 1px solid rgba(255,255,255,0.22);
    margin-right: 16px;
  }

  .logo {
    font-size: 17px;
    font-weight: 800;
    letter-spacing: -0.3px;
    color: var(--white);
    line-height: 1.1;
  }

  .logo .gold { color: var(--gold); }

  /* ── CAL TOGGLE ── */
  .cal-toggle {
    display: flex;
    align-items: center;
    background: rgba(255,255,255,0.14);
    border: 1px solid rgba(255,255,255,0.24);
    border-radius: 999px;
    padding: 3px;
    gap: 2px;
    margin: auto 0;
  }

  .cal-toggle-btn {
    padding: 6px 16px;
    border-radius: 999px;
    border: none;
    font-family: inherit;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.18s;
    color: rgba(255,255,255,0.78);
    background: transparent;
    letter-spacing: 0.2px;
  }

  .cal-toggle-btn.active {
    background: var(--white);
    color: var(--purple);
    box-shadow: none;
  }

  .cal-toggle-btn:not(.active):hover {
    color: var(--white);
    background: rgba(255,255,255,0.16);
  }

  .header-nav {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-left: auto;
  }

  .nav-arrow {
    background: rgba(255,255,255,0.10);
    color: var(--white);
    border: 1px solid rgba(255,255,255,0.25);
    width: 30px;
    height: 30px;
    border-radius: 6px;
    font-size: 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s;
    flex-shrink: 0;
  }
  .nav-arrow:hover { background: var(--gold); color: var(--purple-deep); }

  .month-label {
    font-size: 15px;
    font-weight: 700;
    min-width: 170px;
    text-align: center;
    color: var(--white);
  }

  .print-btn {
    background: var(--white);
    color: var(--purple);
    border: none;
    padding: 7px 16px;
    border-radius: 7px;
    font-family: inherit;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    margin-left: 8px;
    transition: opacity 0.15s, box-shadow 0.15s;
    box-shadow: none;
    letter-spacing: 0.2px;
  }
  .print-btn:hover { opacity: 0.9; box-shadow: none; }

  /* ── WORKSPACE ── */
  .workspace {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* ── CAL TYPE INDICATOR ── */
  .cal-type-bar {
    background: var(--purple-pale);
    color: var(--purple-deep);
    text-align: center;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    padding: 4px 0;
    flex-shrink: 0;
    opacity: 0.92;
  }

  /* ── CALENDAR PANEL ── */
  .calendar-panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 14px;
    overflow: hidden;
    gap: 8px;
  }

  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    grid-template-rows: 32px repeat(6, 1fr);
    gap: 0;
    flex: 1;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    background: var(--border);
    overflow: hidden;
  }

  .cal-header-cell {
    text-align: center;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.6px;
    padding: 8px 0;
    background: var(--purple);
    color: var(--white);
    border-right: 1px solid rgba(255,255,255,0.16);
    text-transform: uppercase;
  }
  .cal-header-cell:nth-child(7) { border-right: 0; }

  .cal-cell {
    background: var(--white);
    border-radius: 0;
    border: 0;
    border-right: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    padding: 6px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-height: 0;
    transition: border-color 0.15s, box-shadow 0.15s;
  }

  .cal-cell.empty { background: #F8F4FA; border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); }

  .cal-cell.sunday {
    background: #FFFFFF;
    border-color: var(--border);
  }
  .cal-cell.sunday .day-num { color: #c9b8d4; }

  .cal-cell.drag-over {
    border-color: var(--gold);
    box-shadow: 0 0 0 2px rgba(221,185,42,0.35);
    background: var(--gold-pale);
  }

  .cal-cell.today { box-shadow: inset 0 0 0 2px var(--purple-light); }
  .cal-cell.today .day-num { color: var(--purple); font-weight: 800; }

  .day-num {
    font-size: 11px;
    font-weight: 800;
    color: var(--purple);
    margin-bottom: 2px;
    flex-shrink: 0;
  }

  .shifts-list {
    display: flex;
    flex-direction: column;
    gap: 2px;
    overflow-y: auto;
    flex: 1;
  }

  .shift-chip {
    font-size: 9.5px;
    font-weight: 700;
    padding: 3px 5px;
    border-radius: 4px;
    color: white;
    display: flex;
    justify-content: space-between;
    gap: 4px;
    align-items: center;
    line-height: 1.25;
  }

  .shift-chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .shift-chip.am  { background: var(--shift-am); }
  .shift-chip.pm  { background: var(--shift-pm); color: var(--white); }
  .shift-chip.sat { background: var(--shift-sat); }

  .shift-chip .remove-btn {
    background: none;
    border: none;
    color: rgba(255,255,255,0.65);
    cursor: pointer;
    font-size: 9px;
    padding: 0 0 0 3px;
    line-height: 1;
    flex-shrink: 0;
  }
  .shift-chip .remove-btn:hover { color: white; }

  /* ── SIDEBAR ── */
  .sidebar {
    width: 268px;
    background: var(--white);
    border-left: 1.5px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    flex-shrink: 0;
  }

  .sidebar-top {
    background: var(--white);
    padding: 10px 14px 8px;
    flex-shrink: 0;
  }

  .sidebar-top h3 {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.7px;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 8px;
  }

  .shift-type-tabs {
    display: flex;
    gap: 4px;
  }

  .tab-btn {
    flex: 1;
    padding: 7px 4px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--white);
    font-family: inherit;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    color: var(--text-muted);
    transition: all 0.15s;
    letter-spacing: 0.2px;
  }

  .tab-btn.active {
    background: var(--purple);
    border-color: var(--purple);
    color: var(--white);
  }

  #tabPM.active {
    background: var(--gold);
    border-color: var(--gold);
    color: var(--white);
  }

  .tab-btn:not(.active):hover {
    background: var(--purple-pale);
    color: var(--purple);
    border-color: var(--purple-muted);
  }

  .staff-list {
    overflow-y: auto;
    flex: 1;
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 3px;
    background: linear-gradient(180deg, var(--white), var(--purple-pale));
  }

  .staff-card {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 10px;
    border-radius: 7px;
    border: 1px solid var(--border);
    background: var(--white);
    cursor: grab;
    border-left: 5px solid var(--purple);
    transition: all 0.15s;
    user-select: none;
  }

  .staff-card:hover {
    border-color: var(--purple-light);
    background: var(--purple-pale);
    transform: translateX(-2px);
    box-shadow: 2px 2px 8px rgba(94,23,113,0.12);
  }

  .staff-card:active { cursor: grabbing; opacity: 0.6; }

  .card-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .staff-card.am .card-dot { background: var(--shift-am); }
  .staff-card.pm {
    background: var(--white);
    border-color: var(--border);
    border-left-color: var(--gold);
    color: var(--text);
  }
  .staff-card.pm:hover {
    background: var(--gold-pale);
    border-color: var(--gold);
    transform: translateX(-2px);
    box-shadow: 2px 2px 8px rgba(221,185,42,0.18);
  }
  .staff-card.pm .card-dot { background: var(--gold); }
  .staff-card.pm .card-name { color: var(--text); }
  .staff-card.pm .card-shift-label { color: var(--gold-dark); }

  .card-name {
    font-size: 12px;
    font-weight: 500;
    flex: 1;
    color: var(--text);
  }

  .card-shift-label {
    font-size: 10px;
    font-weight: 700;
    font-family: 'DM Mono', monospace;
    color: var(--purple);
  }


  /* ── EMPLOYEE MANAGER ── */
  .manage-employees-btn {
    width: 100%;
    margin-top: 8px;
    border: 1px solid var(--border);
    border-radius: 7px;
    background: var(--white);
    color: var(--purple);
    font-family: inherit;
    font-size: 11px;
    font-weight: 800;
    padding: 8px 10px;
    cursor: pointer;
    text-align: center;
  }

  .manage-employees-btn:hover {
    border-color: var(--purple);
    background: var(--purple-pale);
  }

  .employee-modal {
    width: 460px;
    max-height: 82vh;
    display: flex;
    flex-direction: column;
  }

  .employee-modal h2 {
    margin-bottom: 14px;
  }

  .employee-manager {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 6px;
    margin: 0 0 10px;
  }

  .employee-input {
    min-width: 0;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 9px 10px;
    font-family: inherit;
    font-size: 12px;
    color: var(--text);
    background: var(--white);
    outline: none;
  }

  .employee-input:focus {
    border-color: var(--purple-light);
    box-shadow: 0 0 0 2px rgba(94,23,113,0.10);
  }

  .employee-add-btn {
    border: 1px solid var(--purple);
    border-radius: 6px;
    background: var(--purple);
    color: var(--white);
    font-family: inherit;
    font-size: 12px;
    font-weight: 800;
    padding: 9px 12px;
    cursor: pointer;
  }

  .employee-add-btn:hover { opacity: 0.9; }

  .employee-manager-list {
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow-y: auto;
    max-height: 360px;
    background: var(--white);
    margin-bottom: 12px;
  }

  .employee-manager-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 9px 11px;
    border-bottom: 1px solid var(--border);
    font-size: 12px;
    font-weight: 600;
    color: var(--text);
  }

  .employee-manager-row:last-child { border-bottom: 0; }

  .employee-manager-name {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .employee-remove {
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--white);
    color: var(--danger);
    font-size: 11px;
    font-weight: 800;
    line-height: 1;
    padding: 6px 8px;
    cursor: pointer;
    flex-shrink: 0;
  }

  .employee-remove:hover {
    background: var(--danger-pale);
    border-color: #F2B8B5;
  }

  /* ── LEGEND ── */
  .legend {
    padding: 8px 14px;
    border-top: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 4px;
    flex-shrink: 0;
    background: white;
  }

  .legend-label {
    font-size: 9px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--purple);
    margin-bottom: 2px;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 10px;
    color: var(--purple);
  }

  .legend-dot {
    width: 8px;
    height: 8px;
    border-radius: 3px;
    flex-shrink: 0;
  }

  /* ── DRAG GHOST ── */
  .drag-ghost {
    position: fixed;
    pointer-events: none;
    z-index: 1000;
    background: var(--purple-deep);
    color: white;
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 700;
    opacity: 0.92;
    display: none;
    box-shadow: 0 4px 20px rgba(0,0,0,0.35);
    border: 1.5px solid var(--gold);
  }

  /* ── MODAL ── */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(30,10,38,0.55);
    z-index: 500;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(2px);
  }
  .modal-overlay.open { display: flex; }

  .modal {
    background: white;
    border-radius: 14px;
    padding: 28px;
    width: 400px;
    box-shadow: 0 24px 64px rgba(94,23,113,0.25);
    border-top: 4px solid var(--purple);
  }

  .modal h2 {
    font-size: 18px;
    font-weight: 800;
    margin-bottom: 4px;
    color: var(--purple-deep);
  }

  .modal p {
    font-size: 13px;
    color: var(--purple);
    margin-bottom: 20px;
  }

  .modal-btns { display: flex; gap: 8px; flex-direction: column; }

  .modal-btn {
    padding: 12px 16px;
    border-radius: 8px;
    border: none;
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: opacity 0.15s;
    text-align: left;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .modal-btn:hover { opacity: 0.85; }
  .modal-btn.both {
    background: var(--purple);
    color: white;
    border: 1px solid var(--purple);
  }
  .modal-btn.fd,
  .modal-btn.lg,
  .modal-btn.cancel {
    background: var(--white);
    color: var(--purple);
    border: 1px solid var(--border);
  }
</style>
</head>
<body>

<div class="drag-ghost" id="dragGhost"></div>

<header>
  <div class="header-left">
    <div class="logo">Somerset<br><span class="gold">Alumni Center</span></div>
  </div>

  <div class="cal-toggle">
    <button class="cal-toggle-btn active" id="toggleFD" onclick="switchCalendar('frontdesk')">Front Desk</button>
    <button class="cal-toggle-btn" id="toggleLG" onclick="switchCalendar('lifeguard')">Lifeguards</button>
  </div>

  <div class="header-nav">
    <button class="nav-arrow" id="prevMonth">&#8592;</button>
    <div class="month-label" id="monthLabel"></div>
    <button class="nav-arrow" id="nextMonth">&#8594;</button>
    <button class="print-btn" id="openPrintModal">Print Schedule</button>
  </div>
</header>

<div class="cal-type-bar" id="calTypeBar">
  Front Desk Schedule
</div>

<div class="workspace">
  <div class="calendar-panel">
    <div class="cal-grid" id="calGrid"></div>
  </div>

  <div class="sidebar">
    <div class="sidebar-top">
      <h3>Employees — Drag to <span id="sidebarCalName">Front Desk</span></h3>
      <div class="shift-type-tabs">
        <button class="tab-btn active" id="tabAM" onclick="setActiveShift('am')">8–1 AM</button>
        <button class="tab-btn" id="tabPM" onclick="setActiveShift('pm')">5–8 PM</button>
      </div>
      <button class="manage-employees-btn" id="openEmployeeManager" type="button">Manage Employees</button>
    </div>
    <div class="staff-list" id="staffList"></div>
    <div class="legend">
      <div class="legend-label">Shift Key</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--shift-am)"></div>8:00 AM – 1:00 PM (weekdays)</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--shift-pm)"></div>5:00 PM – 8:00 PM (weekdays)</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--shift-sat)"></div>8:00 AM – 12:00 PM (Saturday)</div>
    </div>
  </div>
</div>

<!-- Print Modal -->
<div class="modal-overlay" id="printModal">
  <div class="modal">
    <h2>Print Schedule</h2>
    <p>Choose which schedule to send to the printer for <span id="modalMonth"></span>.</p>
    <div class="modal-btns">
      <button class="modal-btn both" onclick="printSchedule('both')">Print Both</button>
      <button class="modal-btn fd" onclick="printSchedule('frontdesk')">Front Desk Schedule</button>
      <button class="modal-btn lg" onclick="printSchedule('lifeguard')">Lifeguard Schedule</button>
      <button class="modal-btn cancel" onclick="closePrintModal()">Cancel</button>
    </div>
  </div>
</div>

<!-- Employee Manager Modal -->
<div class="modal-overlay" id="employeeModal">
  <div class="modal employee-modal">
    <h2>Manage Employees</h2>
    <div class="employee-manager">
      <input class="employee-input" id="employeeNameInput" type="text" placeholder="New employee name" autocomplete="off">
      <button class="employee-add-btn" id="addEmployeeBtn" type="button">Add</button>
    </div>
    <div class="employee-manager-list" id="employeeManagerList"></div>
    <button class="modal-btn cancel" type="button" onclick="closeEmployeeModal()">Done</button>
  </div>
</div>

<script>
const DEFAULT_EMPLOYEES = [
  "Gianni Anderson","Makenna Baker","Thomas Bradshaw","James Brown",
  "Julian Carroll","Corban Cimala","Mattie Cooper","Jaycee Cothron",
  "Jacob Estep","Keaton Goetz","Jordan Gragg","Charleston Girdler",
  "Tristian Harrell","Hannah Haste","Hayden Hernandez","Tripp Hoseclaw",
  "Ty Jacobs","Marcus Jones","Gavyn Kozak","Clark Litteral",
  "Josh Lewis","Paisley Poore","Leah Quillen","Will Robinson",
  "Adelyn White","Sarah White","Cameron Underwood"
];

const DAYS   = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const MONTHS = ["January","February","March","April","May","June",
                "July","August","September","October","November","December"];

let currentYear  = new Date().getFullYear();
let currentMonth = new Date().getMonth();
let activeShift  = 'am';
let activeCalendar = 'frontdesk'; // 'frontdesk' | 'lifeguard'

// Two separate schedules keyed by dateKey
let schedules = { frontdesk: {}, lifeguard: {} };
let employees = sortEmployees([...DEFAULT_EMPLOYEES]);

const STORAGE_KEY = 'somersetAlumniCenterScheduler.v2';

function getNameParts(name) {
  const parts = String(name).trim().split(/\s+/).filter(Boolean);
  const last = parts.length > 1 ? parts[parts.length - 1] : parts[0] || '';
  const first = parts.length > 1 ? parts.slice(0, -1).join(' ') : '';
  return { first: first.toLowerCase(), last: last.toLowerCase(), full: parts.join(' ').toLowerCase() };
}

function compareEmployees(a, b) {
  const A = getNameParts(a);
  const B = getNameParts(b);
  return A.last.localeCompare(B.last) || A.first.localeCompare(B.first) || A.full.localeCompare(B.full);
}

function sortEmployees(list) {
  const seen = new Set();
  return list
    .map(name => String(name).trim().replace(/\s+/g, ' '))
    .filter(Boolean)
    .filter(name => {
      const key = name.toLowerCase();
      if (seen.has(key)) return false;
      seen.add(key);
      return true;
    })
    .sort(compareEmployees);
}

function saveData() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      employees,
      schedules,
      currentYear,
      currentMonth,
      activeShift,
      activeCalendar
    }));
  } catch (err) {
    console.warn('Schedule data could not be saved.', err);
  }
}

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;

    const saved = JSON.parse(raw);
    if (Array.isArray(saved.employees)) {
      employees = sortEmployees(saved.employees);
    }
    if (!employees.length) employees = sortEmployees([...DEFAULT_EMPLOYEES]);

    if (saved.schedules && typeof saved.schedules === 'object') {
      schedules = normalizeSchedules(saved.schedules);
    }

    if (Number.isInteger(saved.currentYear)) currentYear = saved.currentYear;
    if (Number.isInteger(saved.currentMonth) && saved.currentMonth >= 0 && saved.currentMonth <= 11) currentMonth = saved.currentMonth;
    if (saved.activeShift === 'am' || saved.activeShift === 'pm') activeShift = saved.activeShift;
    if (saved.activeCalendar === 'frontdesk' || saved.activeCalendar === 'lifeguard') activeCalendar = saved.activeCalendar;
  } catch (err) {
    console.warn('Saved schedule data could not be loaded.', err);
  }
}

function normalizeSchedules(savedSchedules) {
  const clean = { frontdesk: {}, lifeguard: {} };
  ['frontdesk', 'lifeguard'].forEach(calKey => {
    const cal = savedSchedules[calKey] || {};
    Object.keys(cal).forEach(key => {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(key) || !Array.isArray(cal[key])) return;
      const entries = cal[key]
        .map(entry => ({
          name: String(entry.name || '').trim(),
          shift: ['am', 'pm', 'sat'].includes(entry.shift) ? entry.shift : 'am'
        }))
        .filter(entry => entry.name);
      if (entries.length) clean[calKey][key] = entries;
    });
  });
  return clean;
}

function escapeHTML(value) {
  return String(value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

function dateKey(y, m, d) {
  return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
}

function getSchedule() { return schedules[activeCalendar]; }

/* ── CALENDAR SWITCH ── */
function switchCalendar(cal) {
  activeCalendar = cal;
  document.getElementById('toggleFD').classList.toggle('active', cal === 'frontdesk');
  document.getElementById('toggleLG').classList.toggle('active', cal === 'lifeguard');
  document.getElementById('calTypeBar').textContent =
    cal === 'frontdesk' ? 'Front Desk Schedule' : 'Lifeguard Schedule';
  document.getElementById('sidebarCalName').textContent =
    cal === 'frontdesk' ? 'Front Desk' : 'Lifeguards';
  saveData();
  renderCalendar();
}

/* ── SHIFT TYPE TABS ── */
function setActiveShift(type) {
  activeShift = type;
  document.getElementById('tabAM').classList.toggle('active', type === 'am');
  document.getElementById('tabPM').classList.toggle('active', type === 'pm');
  saveData();
  renderSidebar();
}

/* ── SIDEBAR ── */
function renderSidebar() {
  const list = document.getElementById('staffList');
  list.innerHTML = '';
  const label = activeShift === 'am' ? '8–1' : '5–8';

  employees = sortEmployees(employees);

  employees.forEach(name => {
    const card = document.createElement('div');
    card.className = `staff-card ${activeShift}`;
    card.draggable = true;
    card.innerHTML = `<div class="card-dot"></div><div class="card-name">${escapeHTML(name)}</div><div class="card-shift-label">${label}</div>`;

    card.addEventListener('dragstart', e => {
      e.dataTransfer.setData('name', name);
      e.dataTransfer.setData('shift', activeShift);
      const ghost = document.getElementById('dragGhost');
      ghost.textContent = `${name} · ${label}`;
      ghost.style.display = 'block';
      e.dataTransfer.setDragImage(ghost, 0, 0);
    });
    card.addEventListener('dragend', () => {
      document.getElementById('dragGhost').style.display = 'none';
    });

    list.appendChild(card);
  });
}

function renderEmployeeManager() {
  const list = document.getElementById('employeeManagerList');
  if (!list) return;
  employees = sortEmployees(employees);
  list.innerHTML = '';

  employees.forEach(name => {
    const row = document.createElement('div');
    row.className = 'employee-manager-row';
    row.innerHTML = `<div class="employee-manager-name">${escapeHTML(name)}</div><button class="employee-remove" type="button">Remove</button>`;
    row.querySelector('.employee-remove').addEventListener('click', () => removeEmployee(name));
    list.appendChild(row);
  });
}

function openEmployeeModal() {
  renderEmployeeManager();
  document.getElementById('employeeModal').classList.add('open');
  setTimeout(() => document.getElementById('employeeNameInput').focus(), 0);
}

function closeEmployeeModal() {
  document.getElementById('employeeModal').classList.remove('open');
}

function addEmployeeFromInput() {
  const input = document.getElementById('employeeNameInput');
  const name = input.value.trim().replace(/\s+/g, ' ');
  if (!name) return;

  const exists = employees.some(existing => existing.toLowerCase() === name.toLowerCase());
  if (exists) {
    input.value = '';
    return;
  }

  employees.push(name);
  employees = sortEmployees(employees);
  input.value = '';
  saveData();
  renderSidebar();
  renderEmployeeManager();
}

function removeEmployee(name) {
  const hasAssignments = ['frontdesk', 'lifeguard'].some(calKey =>
    Object.values(schedules[calKey] || {}).some(entries => entries.some(entry => entry.name === name))
  );

  const message = hasAssignments
    ? `Remove ${name} from the employee list and all scheduled shifts?`
    : `Remove ${name} from the employee list?`;
  if (!confirm(message)) return;

  employees = employees.filter(employee => employee !== name);
  ['frontdesk', 'lifeguard'].forEach(calKey => {
    Object.keys(schedules[calKey]).forEach(key => {
      schedules[calKey][key] = schedules[calKey][key].filter(entry => entry.name !== name);
      if (!schedules[calKey][key].length) delete schedules[calKey][key];
    });
  });

  employees = sortEmployees(employees);
  saveData();
  renderSidebar();
  renderEmployeeManager();
  renderCalendar();
}

/* ── CALENDAR ── */
function renderCalendar() {
  document.getElementById('monthLabel').textContent = `${MONTHS[currentMonth]} ${currentYear}`;
  const grid = document.getElementById('calGrid');
  grid.innerHTML = '';

  DAYS.forEach(d => {
    const h = document.createElement('div');
    h.className = 'cal-header-cell';
    h.textContent = d;
    grid.appendChild(h);
  });

  const firstDay    = new Date(currentYear, currentMonth, 1).getDay();
  const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
  const today       = new Date();

  let visibleCells = 0;
  for (let i = 0; i < firstDay; i++) {
    const cell = document.createElement('div');
    cell.className = 'cal-cell empty';
    grid.appendChild(cell);
    visibleCells++;
  }

  for (let d = 1; d <= daysInMonth; d++) {
    const dow       = new Date(currentYear, currentMonth, d).getDay();
    const isSunday  = dow === 0;
    const isSaturday = dow === 6;
    const key       = dateKey(currentYear, currentMonth, d);

    const cell = document.createElement('div');
    cell.className = 'cal-cell' + (isSunday ? ' sunday' : '');
    if (!isSunday) cell.style.cursor = 'default';
    if (d === today.getDate() && currentMonth === today.getMonth() && currentYear === today.getFullYear())
      cell.classList.add('today');
    cell.dataset.key = key;
    cell.dataset.dow = dow;

    const dayNum = document.createElement('div');
    dayNum.className = 'day-num';
    dayNum.textContent = d;
    cell.appendChild(dayNum);

    if (!isSunday) {
      cell.addEventListener('dragover', e => { e.preventDefault(); cell.classList.add('drag-over'); });
      cell.addEventListener('dragleave', () => cell.classList.remove('drag-over'));
      cell.addEventListener('drop', e => {
        e.preventDefault();
        cell.classList.remove('drag-over');
        addShift(key, e.dataTransfer.getData('name'), e.dataTransfer.getData('shift'), isSaturday);
      });
    }

    const shiftsList = document.createElement('div');
    shiftsList.className = 'shifts-list';
    cell.appendChild(shiftsList);
    renderCellShifts(shiftsList, key, isSaturday);
    grid.appendChild(cell);
    visibleCells++;
  }

  while (visibleCells < 42) {
    const cell = document.createElement('div');
    cell.className = 'cal-cell empty';
    grid.appendChild(cell);
    visibleCells++;
  }
}

function renderCellShifts(container, key, isSaturday) {
  container.innerHTML = '';
  const sched  = getSchedule();
  const shifts = sched[key] || [];

  shifts.forEach((entry, idx) => {
    const chip = document.createElement('div');
    chip.className = `shift-chip ${isSaturday ? 'sat' : entry.shift}`;

    const nameSpan = document.createElement('span');
    nameSpan.textContent = entry.name;

    const removeBtn = document.createElement('button');
    removeBtn.className = 'remove-btn';
    removeBtn.type = 'button';
    removeBtn.title = 'Remove';
    removeBtn.textContent = '✕';
    removeBtn.addEventListener('click', e => {
      e.stopPropagation();
      removeShift(key, idx);
    });

    chip.appendChild(nameSpan);
    chip.appendChild(removeBtn);
    container.appendChild(chip);
  });
}

function addShift(key, name, shift, isSaturday) {
  if (!name || !['am', 'pm'].includes(shift)) return;

  const sched = getSchedule();
  if (!sched[key]) sched[key] = [];
  if (sched[key].some(e => e.name === name)) return;
  sched[key].push({ name, shift: isSaturday ? 'sat' : shift });
  saveData();
  refreshCell(key);
}

function removeShift(key, idx) {
  const sched = getSchedule();
  if (!sched[key]) return;
  sched[key].splice(idx, 1);
  if (!sched[key].length) delete sched[key];
  saveData();
  refreshCell(key);
}

function refreshCell(key) {
  const cell = document.querySelector(`[data-key="${key}"]`);
  if (!cell) return;
  const isSat = parseInt(cell.dataset.dow) === 6;
  renderCellShifts(cell.querySelector('.shifts-list'), key, isSat);
}

/* ── NAV ── */
document.getElementById('prevMonth').addEventListener('click', () => {
  if (--currentMonth < 0) { currentMonth = 11; currentYear--; }
  saveData();
  renderCalendar();
});
document.getElementById('nextMonth').addEventListener('click', () => {
  if (++currentMonth > 11) { currentMonth = 0; currentYear++; }

document.getElementById('openPrintModal').addEventListener('click', () => {

/* ── PRINT ── */
function getPrintCalendarCells(calKey, monthName, year) {
  const sched       = schedules[calKey];
  const mIdx        = MONTHS.indexOf(monthName);
  const daysInMonth = new Date(year, mIdx + 1, 0).getDate();
  const firstDay    = new Date(year, mIdx, 1).getDay();

  let cells = [];
  for (let i = 0; i < firstDay; i++) cells.push({ empty: true });
  for (let d = 1; d <= daysInMonth; d++) {
    const dow = new Date(year, mIdx, d).getDay();
    const key = dateKey(year, mIdx, d);
    cells.push({ empty: false, d, dow, shifts: sched[key] || [] });
  }
  while (cells.length < 42) cells.push({ empty: true });
  return cells;
}

function svgEscape(value) {
  return String(value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&apos;');
}

function fitSvgText(value, maxChars = 22) {
  const text = String(value);
  return text.length <= maxChars ? text : text.slice(0, maxChars - 1) + '…';
}

function buildPrintSheet(calKey, monthName, year) {
  const calLabel = calKey === 'frontdesk' ? 'Front Desk' : 'Lifeguards';
  const cells = getPrintCalendarCells(calKey, monthName, year);

  // SVG print workaround:
  // Use integer geometry and draw the calendar grid with single shared lines.
  // This avoids Chrome print-preview gaps caused by fractional SVG coordinates,
  // overlapping strokes, and anti-aliased borders.
  const pageW = 1100;
  const pageH = 850;
  const shellX = 25;
  const shellY = 24;
  const shellW = 1050;        // 7 columns × 150
  const topH = 55;
  const daysH = 30;
  const gridY = shellY + topH + daysH;
  const colW = 150;
  const rowH = 120;
  const gridW = colW * 7;
  const gridH = rowH * 6;
  const shellH = topH + daysH + gridH;
  // Monochrome print palette so the printed page is designed for black-and-white printers
  // instead of relying on purple/yellow color conversion.
  const bar = '#111111';
  const grid = '#222222';
  const headerLine = '#555555';
  const assignmentFill = '#FFFFFF';
  const assignmentEdge = '#111111';
  const assignmentStroke = '#333333';
  const text = '#111111';
  const mutedText = '#777777';

  let out = `<section class="sheet"><svg class="print-svg" viewBox="0 0 ${pageW} ${pageH}" xmlns="http://www.w3.org/2000/svg" aria-label="${svgEscape(calLabel)} ${svgEscape(monthName)} ${year}" shape-rendering="crispEdges">`;

  // Solid, flush background blocks. Borders are drawn separately as shared lines.
  out += `<rect x="0" y="0" width="${pageW}" height="${pageH}" fill="#fff"/>`;
  out += `<rect x="${shellX}" y="${shellY}" width="${shellW}" height="${shellH}" fill="#fff"/>`;
  out += `<rect x="${shellX}" y="${shellY}" width="${shellW}" height="${topH}" fill="${bar}"/>`;
  out += `<rect x="${shellX}" y="${shellY + topH}" width="${shellW}" height="${daysH}" fill="${bar}"/>`;
  out += `<rect x="${shellX}" y="${gridY}" width="${gridW}" height="${gridH}" fill="#fff"/>`;

  // Top bar text.
  out += `<text x="${shellX + 18}" y="${shellY + 36}" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="800" fill="#fff" shape-rendering="geometricPrecision">Somerset Alumni Center</text>`;
  out += `<text x="${shellX + shellW - 14}" y="${shellY + 24}" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="800" text-anchor="end" fill="#fff" shape-rendering="geometricPrecision">${svgEscape(calLabel)}</text>`;
  out += `<text x="${shellX + shellW - 14}" y="${shellY + 42}" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="end" fill="#fff" shape-rendering="geometricPrecision">${svgEscape(monthName)} ${year}</text>`;

  // Header separators and weekday labels.
  const rightPanelX = shellX + shellW - 185;
  out += `<line x1="${rightPanelX}" y1="${shellY}" x2="${rightPanelX}" y2="${shellY + topH}" stroke="${headerLine}" stroke-width="1"/>`;
  DAYS.forEach((dayName, i) => {
    const x = shellX + i * colW;
    if (i > 0) out += `<line x1="${x}" y1="${shellY + topH}" x2="${x}" y2="${shellY + topH + daysH}" stroke="${headerLine}" stroke-width="1"/>`;
    out += `<text x="${x + colW / 2}" y="${shellY + topH + 20}" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="800" text-anchor="middle" fill="#fff" shape-rendering="geometricPrecision">${svgEscape(dayName.toUpperCase())}</text>`;
  });

  // Calendar entries. The cells stay plain white; the grid is drawn afterward so all
  // borders land perfectly on top and remain connected.
  for (let r = 0; r < 6; r++) {
    for (let c = 0; c < 7; c++) {
      const idx = r * 7 + c;
      const day = cells[idx];
      const x = shellX + c * colW;
      const y = gridY + r * rowH;
      if (!day || day.empty) continue;

      out += `<text x="${x + colW - 8}" y="${y + 15}" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="800" text-anchor="end" fill="#111" shape-rendering="geometricPrecision">${day.d}</text>`;

      if (day.dow === 0) {
        out += `<text x="${x + colW / 2}" y="${y + rowH / 2 + 5}" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="${mutedText}" shape-rendering="geometricPrecision">–</text>`;
        continue;
      }

      const shifts = day.shifts || [];
      if (!shifts.length) {
        out += `<text x="${x + colW / 2}" y="${y + rowH / 2 + 5}" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="${mutedText}" shape-rendering="geometricPrecision">–</text>`;
        continue;
      }

      const ordered = [...shifts].sort((a, b) => {
        const order = { am: 1, pm: 2, sat: 3 };
        return (order[a.shift] || 9) - (order[b.shift] || 9) || a.name.localeCompare(b.name);
      });

      ordered.slice(0, 5).forEach((s, n) => {
        const isSat = day.dow === 6 || s.shift === 'sat';
        const label = isSat ? '8–12' : (s.shift === 'pm' ? '5–8' : '8–1');
        const ay = y + 24 + n * 18;
        const ax = x + 7;
        const aw = colW - 14;
        out += `<rect x="${ax}" y="${ay}" width="${aw}" height="15" rx="3" fill="${assignmentFill}" stroke="${assignmentStroke}" stroke-width="0.8"/>`;
        out += `<rect x="${ax}" y="${ay}" width="4" height="15" rx="2" fill="${assignmentEdge}"/>`;
        out += `<text x="${ax + 9}" y="${ay + 10.8}" font-family="Inter, Arial, sans-serif" font-size="8.4" font-weight="800" fill="${text}" shape-rendering="geometricPrecision">${svgEscape(fitSvgText(s.name, 20))}</text>`;
        out += `<text x="${ax + aw - 5}" y="${ay + 10.8}" font-family="Inter, Arial, sans-serif" font-size="7.8" font-weight="800" text-anchor="end" fill="${text}" shape-rendering="geometricPrecision">${label}</text>`;
      });

      if (ordered.length > 5) {
        out += `<text x="${x + 8}" y="${y + 116}" font-family="Inter, Arial, sans-serif" font-size="8" font-weight="800" fill="${mutedText}" shape-rendering="geometricPrecision">+${ordered.length - 5} more</text>`;
      }
    }
  }

  // Shared grid lines: single strokes only, aligned to integer coordinates.
  out += `<line x1="${shellX}" y1="${shellY}" x2="${shellX + shellW}" y2="${shellY}" stroke="${grid}" stroke-width="2"/>`;
  out += `<line x1="${shellX}" y1="${shellY + topH}" x2="${shellX + shellW}" y2="${shellY + topH}" stroke="${headerLine}" stroke-width="1"/>`;
  out += `<line x1="${shellX}" y1="${shellY + topH + daysH}" x2="${shellX + shellW}" y2="${shellY + topH + daysH}" stroke="${grid}" stroke-width="2"/>`;
  for (let c = 0; c <= 7; c++) {
    const x = shellX + c * colW;
    out += `<line x1="${x}" y1="${gridY}" x2="${x}" y2="${gridY + gridH}" stroke="${grid}" stroke-width="1.5"/>`;
  }
  for (let r = 0; r <= 6; r++) {
    const y = gridY + r * rowH;
    out += `<line x1="${shellX}" y1="${y}" x2="${shellX + gridW}" y2="${y}" stroke="${grid}" stroke-width="1.5"/>`;
  }
  out += `<rect x="${shellX}" y="${shellY}" width="${shellW}" height="${shellH}" fill="none" stroke="${grid}" stroke-width="2"/>`;

  out += `</svg></section>`;
  return out;
}

function buildScheduleHTML(which, monthName, year) {
  const title = which === 'both' ? `Schedules — ${monthName} ${year}` : `${which === 'frontdesk' ? 'Front Desk' : 'Lifeguards'} — ${monthName} ${year}`;
  const sheets = which === 'both'
    ? buildPrintSheet('frontdesk', monthName, year) + buildPrintSheet('lifeguard', monthName, year)
    : buildPrintSheet(which, monthName, year);

  return `<!DOCTYPE html><html><head>
<title>${title}</title>
<meta charset="UTF-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;min-height:100%;background:white;}
body{font-family:'Inter',Arial,sans-serif;color:#111;background:white;padding:0;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
.sheet{width:11in;height:8.5in;margin:0 auto;background:white;display:block;overflow:hidden;page-break-after:always;break-after:page;}
.sheet:last-child{page-break-after:auto;break-after:auto;}
.print-svg{display:block;width:11in;height:8.5in;background:white;}
@media screen{
  body{background:#e9e9e9;padding:0;}
  .sheet{margin:0 auto 16px auto;box-shadow:0 2px 12px rgba(0,0,0,.22);}
}
@media print{
  @page{size:letter landscape;margin:0;}
  html,body{width:11in;height:auto;margin:0;padding:0;background:white;}
  .sheet{width:11in;height:8.5in;margin:0;page-break-after:always;break-after:page;}
  .sheet:last-child{page-break-after:auto;break-after:auto;}
  .print-svg{width:11in;height:8.5in;}
}
</style></head><body>
${sheets}
<script>window.onload=()=>setTimeout(()=>window.print(),150);<\/script>
</body></html>`;
}

function printSchedule(which) {
  closePrintModal();
  const monthName = MONTHS[currentMonth];
  const year      = currentYear;
  const win = window.open('', '_blank');

  if (!win) {
    alert('The print window was blocked. Allow pop-ups for this file, then try again.');
    return;
  }

  win.document.write(buildScheduleHTML(which, monthName, year));
  win.document.close();
}
