<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Somerset Alumni Center</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Lato:wght@300;400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html { height: 100%; overflow: hidden; }

  :root {
    --purple: #541565;
    --gold: #DDB92A;
    --light: #F7F1F9;
  }

  body {
    height: 100vh;
    overflow: hidden;
    background-color: var(--purple);
    background-image:
      radial-gradient(ellipse at 20% 50%, rgba(221,185,42,0.08) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 20%, rgba(255,255,255,0.04) 0%, transparent 50%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Lato', sans-serif;
    color: var(--light);
    padding: 2rem;
  }

  .card {
    text-align: center;
    max-width: 520px;
    animation: fadeUp 0.9s ease both;
  }

  .icon {
    width: 64px;
    height: 64px;
    margin: 0 auto 2rem;
    opacity: 0.9;
    animation: fadeUp 0.9s 0.1s ease both;
  }

  .divider {
    width: 48px;
    height: 3px;
    background: var(--gold);
    margin: 1.5rem auto;
    border-radius: 2px;
    animation: fadeUp 0.9s 0.2s ease both;
  }

  h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(1.6rem, 5vw, 2.4rem);
    font-weight: 700;
    letter-spacing: 0.01em;
    color: #fff;
    animation: fadeUp 0.9s 0.15s ease both;
  }

  .org {
    font-size: 0.78rem;
    font-weight: 400;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 0.5rem;
    animation: fadeUp 0.9s 0.05s ease both;
  }

  p {
    font-size: 1rem;
    font-weight: 300;
    line-height: 1.75;
    color: rgba(249,245,255,0.75);
    animation: fadeUp 0.9s 0.3s ease both;
  }

  .badge {
    display: inline-block;
    margin-top: 2rem;
    padding: 0.45rem 1.1rem;
    border: 1.5px solid rgba(221,185,42,0.4);
    border-radius: 999px;
    font-size: 0.72rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--gold);
    animation: fadeUp 0.9s 0.4s ease both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>
<div class="card">
  <p class="org">Somerset Alumni Center</p>

  <svg class="icon" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
    <circle cx="32" cy="32" r="30" stroke="#DDB92A" stroke-width="2" stroke-dasharray="6 4" opacity="0.5"/>
    <path d="M32 18v16" stroke="#DDB92A" stroke-width="3" stroke-linecap="round"/>
    <circle cx="32" cy="41" r="2.5" fill="#DDB92A"/>
  </svg>

  <h1>Currently Unavailable</h1>
  <div class="divider"></div>
  <p>This website is currently down.<br>Thank you for your patience.</p>
</div>
</body>
</html>
